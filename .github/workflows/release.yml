name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write # needed to be able to do OIDC handshake for NuGet Trusted Publishing
  contents: write # needed to be able to make releases via the GitHub API

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: 'global.json'
          dotnet-version: 10.x

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Release
        run: dotnet fsi build.fsx -- -p Release
        env:
          NUGET_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
